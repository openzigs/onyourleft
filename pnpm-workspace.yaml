# ADR 0005 decision D. `apps/*` is AGPL-3.0-or-later, `packages/*` is
# Apache-2.0, and the licence boundary is the directory itself.
#
# `apps/*` picks up `apps/instance`, the self-hostable instance server
# (ADR 0036, #767), with no entry of its own. There is no `apps/api`: that was
# the name owner decision D6 forbade, and ADR 0036 lifted D6 for a server
# called `apps/instance` instead.
packages:
  - 'apps/*'
  - 'packages/*'

# unrs-resolver (a transitive dependency of eslint-import-resolver-typescript)
# ships a postinstall script. It also ships prebuilt native bindings as platform
# optional dependencies, which is the path pnpm actually installs, so the script
# has nothing left to do. Denied rather than left undecided: an install script
# runs arbitrary code with the developer's privileges before any lint or test
# gate sees the package, and until #781 this was the one dependency in the
# workspace that asked for that.
#
# workerd (#781) ships a postinstall script too, and it has nothing to do here
# either: the runtime is the platform package pnpm installs as an optional
# dependency (`@cloudflare/workerd-<os>-<arch>`), `require('workerd').default`
# already names it, and the script only re-links that binary over the package's
# JavaScript shim or, where the optional dependency is missing, downloads it
# from npm — a network fetch at install time that nothing here asks for. It is
# a devDependency of apps/instance for the Durable Object adapter's local
# suite and ships in nothing.
allowBuilds:
  unrs-resolver: false
  workerd: false

# Refuse to install on a Node or pnpm version outside the root package.json's
# `engines` (ADR 0005: Node 26 since its amendment of 2026-10-29, pnpm 11),
# rather than installing and failing later in a way that reads as a code bug.
# ⚠️ Here and not in `.npmrc` (#1597): pnpm 11 reads only auth, registry, TLS
# and proxy settings from `.npmrc`, so the `engine-strict=true` there had been
# ignored — Node 24 was let through a Node 26 `engines` with a warning.
engineStrict: true
