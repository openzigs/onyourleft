# --- The side camera's pose model (#530; ADR 0031 D-1, ADR 0033 D-6) ---------
#
# Committed rather than fetched, and served from the app's own origin, because
# spike 0010 §7 forbids loading it from a CDN or from the guide's `latest/`
# URL: the URL below is the PINNED version, `float16/1/`, and on 2026-09-25 it
# served the same bytes as `latest/` and as the file spike 0010 measured.
#
# ⚠️ **The licence covers two networks, and one of them is not named by the
# card.** The `.task` bundles `pose_detector.tflite` and
# `pose_landmarks_detector.tflite`; Google's model card — "LICENSED UNDER Apache
# License, Version 2.0", *MediaPipe BlazePose GHUM 3D*, dated 2021-04-16, read
# first-hand 2026-09-25 — describes the landmark network. Spike 0010 §3 left the
# detector to whoever commits it, and this is the answer: Google's own index,
# `google-ai-edge/mediapipe` `docs/solutions/models.md` §Pose (read 2026-09-25),
# lists the "Pose detection model" and the three landmark models together under
# ONE "Model card" link, the same card. That is the first-party statement that
# the detector ships under it; there is no other licence anywhere for it, and
# the repository it is indexed from is Apache-2.0 too. Recorded here so the
# next reader does not re-open it.
#
# `creator` and `url` are recorded as a courtesy, which puts the model on the
# in-app credits screen; Apache-2.0 asks for no such line.
[[asset]]
path = "apps/web/public/pose/pose_landmarker_lite.task"
source = "Google MediaPipe, Pose Landmarker lite (BlazePose GHUM 3D), float16, version 1; upstream bytes, unmodified — https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
licence = "Apache-2.0"
read = "2026-09-25"
sha256 = "59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a"
creator = "Google (MediaPipe)"
url = "https://storage.googleapis.com/mediapipe-assets/Model%20Card%20BlazePose%20GHUM%203D.pdf"
modified = "no"

