# ASSETS.toml — provenance, licence and integrity for every committed binary.
#
# Enforced by `scripts/check-repo-rules.sh` rules ASSET001-ASSET005, which run
# on a bare clone with bash and coreutils and no install. #339.
#
# ## Why this file exists
#
# Every other licence gate in this repository reads text. `LIC001`/`LIC002`
# want an SPDX identifier in a file's first five lines, and a binary has no
# such thing. `DEP001` reads npm's own resolution of the lockfile, and a
# committed file is in no dependency closure at all. So a `.glb` model, a
# launcher icon or a fixture could land here with no licence recorded, no
# source recorded and nothing that would notice it being replaced — and every
# gate would have been green about it.
#
# This file is the record those gates cannot make. One entry per committed
# binary; five keys always, and three more when the licence asks for something
# back:
#
#   path     repository-relative, exact — no globs, the style `.spdx-exempt`
#            uses, and for the same reason
#   source   which pack, which generator, which URL. CC0 requires no
#            attribution; that is not a reason to record nothing
#   licence  checked against where the file lands — permissive anywhere, weak
#            (CC0-1.0 and friends) and attribution-requiring (CC-BY-4.0, ADR
#            0023) under `apps/` only, mirroring ADR 0015 D-2's
#            distributed-closure table. Anything else fails closed
#   read     the date the source and its terms were read, per this repository's
#            habit of dating every figure that drifts
#   sha256   of the committed bytes
#
# and, required only when `licence` is one that requires attribution — today
# exactly `CC-BY-4.0` — and accepted on any entry (ASSET006, #357):
#
#   creator  the name to credit, as the source gives it
#   url      a link to the material, which CC BY 4.0 §3(a)(1)(A) asks for
#            alongside the creator
#   modified whether this repository changed it, and how. §3(a)(1)(B) requires
#            indicating that changes were made; merging a model of several
#            parts into one geometry is such a change, and so is rescaling one.
#            `"no"` where nothing was changed — the key is required either way,
#            because an absent answer and "nothing to declare" are the two
#            things this file exists to tell apart
#
# ⚠️ **CC-BY is a continuing obligation and nothing else here is.** Every
# other licence on either list is discharged the moment the row exists. This one
# is discharged by the SHIPPED APP crediting the work, every time it ships, for
# as long as it ships — so these three keys are the data the credits screen is
# generated from (#358), not decoration. ADR 0023 §Consequences states the trade.
#
# ⚠️ An unrecognised key is REFUSED rather than ignored (ASSET005), the choice
# ADR 0017 D-4 made for the workout file and for the same reason: a key nobody
# reads is a claim about an asset that silently has no effect.
#
# ⚠️ **What a recorded digest does and does not prove.** It pins what is
# committed, so a substitution is visible in review and in CI. It does NOT
# establish that the bytes are the upstream artefact they name — nothing that
# runs without the network can. `apps/mobile/README.md` §4 records
# `gradle-wrapper.jar` as exactly such a file, and that is still true; what has
# changed is that its bytes can no longer be swapped without a diff.
#
# ⚠️ **The FIT corpus is generated, and its digests move when the generator
# does.** That is a cost and it is deliberate: CLAUDE.md §4a says
# `fixtures:generate` "is DETERMINISTIC: running it on a clean tree leaves
# `git status` clean", and these twelve digests are the only thing that makes
# that claim checkable by something other than a person remembering to look.
# Regenerate the corpus and update them in the same commit.

