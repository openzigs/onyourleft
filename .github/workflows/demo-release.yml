# The demo's route data as a GitHub release asset — #1932, ADR 0056 D-4.2.
#
# By hand only (`workflow_dispatch`, from `main`): bakes every preset route
# with `demo:bake` (apps/web/tools/demo/bake-route.ts), builds the demo, and
# publishes a GitHub release whose assets are each route's `.bin`, the
# `routes.json` that describes them and the `LICENCE-ODbL.txt` notice. Its
# notes carry the ODbL notice too. ADR 0056 D-4.2 offers the entire
# Derivative Database (ODbL section 4.6 a) beside the demo and as a release
# asset, and D-4.3 has a video's post name that asset's URL; this is the
# release it names. `docs/demo-embedding.md` gives the URLs.
#
# ⚠️ No pull-request trigger of any kind, on purpose. This is the release job
# ADR 0056 D-9 means: it bakes OpenStreetMap data from the published archive,
# which a pull request's checks never do. `tools/demo/demo-release.test.ts`
# reads this file and holds it to that, to its pins and to its permissions.
#
# ⚠️ Two jobs, so the write token never meets the build. `bake` installs the
# workspace's dependencies and runs the repository's code with `contents:
# read`, and uploads what it staged as an artefact. `publish` alone holds
# `contents: write`, checks out nothing and runs only `gh release create`.
# No secret beyond the run's own GITHUB_TOKEN, standard runners only
# (CLAUDE.md section 8), every action pinned to a full commit SHA, and the tag
# reaches each script as an environment variable, never pasted into it.
#
# A bake that disagrees with a preset route's committed record fails the run
# before anything is published (`bake-route.ts` §`settleRecord`): the release
# holds the files the committed digests name, or nothing.

name: Demo route release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, demo-YYYY-MM-DD (demo-YYYY-MM-DD.2 for a second that day)
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bake:
    name: Bake the preset routes and build the demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse a ref other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != 'refs/heads/main' ]; then
            echo "::error::A demo release is built from main, not $REF"
            exit 1
          fi

      - name: Check out the repository
        # Pinned to a full commit SHA, as in rules.yml:
        #   gh api repos/actions/checkout/git/ref/tags/v7.0.1 --jq .object.sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        #   gh api repos/actions/setup-node/git/ref/tags/v7.1.0 --jq .object.sha
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          npm install --global --ignore-scripts corepack@0.36.0
          corepack enable pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bake the preset routes
        run: |
          set -euo pipefail
          routes=$(pnpm --silent --filter @onyourleft/web run demo:release -- --list)
          if [ -z "$routes" ]; then
            echo '::error::apps/web/demo/routes/ holds no preset route'
            exit 1
          fi
          for route in $routes; do
            pnpm --filter @onyourleft/web run demo:bake -- --route "$route"
          done

      # The build reads the baked routes back and fails without their notice
      # or above the per-route ceiling (tools/demo/demo-routes.ts).
      - name: Build the demo
        run: pnpm --filter @onyourleft/web run build:demo

      - name: Stage the release
        env:
          TAG: ${{ inputs.tag }}
        run: >-
          pnpm --filter @onyourleft/web run demo:release --
          --tag "$TAG" --stage "$RUNNER_TEMP/demo-release/assets"
          --notes "$RUNNER_TEMP/demo-release/notes.md"

      #   gh api repos/actions/upload-artifact/git/ref/tags/v7.0.2 --jq .object.sha
      - name: Upload the staged release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-release
          path: ${{ runner.temp }}/demo-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: bake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      #   gh api repos/actions/download-artifact/git/ref/tags/v8.0.2 --jq .object.sha
      - name: Download the staged release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-release
          path: ${{ runner.temp }}/demo-release

      # Not the repository's latest release: that stays the app's (release.yml).
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/demo-release"
          gh release create "$TAG" assets/* \
            --target "$TARGET" \
            --title "Demo route data $TAG" \
            --notes-file notes.md \
            --latest=false
