# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The heaviest checks that are NOT safety gates, run once a night -- #866.
#
# ⚠️ THIS IS NOT A REQUIRED CHECK AND CANNOT BLOCK A MERGE. `main` requires one
# status check, `Repository rules` (rules.yml, docs/agents/ci.md section 4c), and this
# workflow reports under a different name on purpose: renaming it to that would
# make the required check report twice. A break in anything here is found the
# next morning -- by the issue the `Report a red run` job opens -- and not
# before the merge that caused it. The owner accepted that trade on 2026-09-29
# for the checks moved here, and ONLY for checks that are not safety gates:
# trainer control, privacy, licences and notices, accessibility and layout, and
# the wiring gate all stay in the required job. ONE exception, the owner's of
# 2026-10-03 (#1076): the reflow walk in the DARK palette runs here, while the
# same walk in the light palette stays required -- so layout is still gated on
# every pull request, and what moved is its repeat in the second palette.
#
# What runs here, each moved out of rules.yml by #866:
#
#   test:uninstrumented -- the #545 near-field rides and the FIT decode fuzz,
#   the two files #852 took out of coverage (28 s on run 36634388848). The
#   fuzz is a robustness sweep over the decoder: the named refusals the
#   decoder makes -- XXE, bad CRC, the bounds -- are unit tests that stay in
#   the required `test:required`. `check:test-split`, which stays required,
#   still fails a file that is in no Vitest run. Since #1076 it also runs
#   apps/web/src/game/realistic-textures.test.ts -- the realistic world's
#   texture checks, about 30 s of the required job on the EPYC 7763 -- on the
#   owner's ruling of 2026-10-03: the opt-in realistic world, #866's class.
#
#   test:browser:nightly -- every browser-gate describe tagged `@nightly`,
#   which is the reviewed list in apps/web/browser/nightly.ts, with each
#   describe's seconds and why it is not a safety gate. All but one draw the
#   realistic world, a rung a rider chooses and is off by default (ADR 0026
#   D-3); the one is the reflow walk's DARK palette (#1076, the owner's
#   ruling of 2026-10-03), whose light-palette twin stays required. `nightly-split.test.ts`, in the required suite, fails a tag that
#   list does not name and a script or workflow that stops running them.
#
# And, since #1280 (the owner's ruling of 2026-10-12), the one thing here that
# is a REPORT rather than a check:
#
#   test:coverage -- the files the required job runs as `test:required`, run
#   again under V8's coverage, with the table published to this run's summary
#   and the HTML uploaded as the `coverage-report` artefact. Taking coverage
#   in the required job cost it 106 to 133 s on the EPYC 7763 (run
#   38243281606) while that job was being cancelled at its stop with every
#   test green. No test left the required job: `check:test-split` fails the
#   two scripts if their excludes differ. Coverage is reported, never gated
#   (ADR 0005 decision C), so what moved is a table, from every pull
#   request's run summary to one run a night.
name: Nightly heavy checks

# `schedule` and `workflow_dispatch`, plus a pull request that changes THIS
# file: the only way to see a change to a scheduled workflow run before it is
# merged is to run it on the pull request that makes it. It is not required
# there either, and the reporting job does not run on a pull request.
# The target-context pull-request trigger is banned (WF001) and is not here.
on:
  schedule:
    # 03:17 UTC: off the hour, when scheduled runs queue longest.
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    # What decides what runs here, as well as this file (#878's review): a
    # pull request that retags a describe or edits a moved check sees it run
    # before merge. Still not required.
    paths:
      - .github/workflows/nightly.yml
      - apps/web/browser/nightly.ts
      - apps/web/browser/game.browser.spec.ts
      - apps/web/browser/realistic.browser.spec.ts
      - apps/web/browser/reflow.browser.spec.ts
      - apps/web/playwright.config.ts
      - apps/web/src/game/near-field.test.ts
      - apps/web/src/game/realistic-textures.test.ts
      - package.json
      - packages/fit/tools/fuzz/decode-fuzz.test.ts
      - scripts/coverage-summary.mjs

# Read-only by default. Only the reporting job widens it, to issues alone.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  heavy:
    name: Nightly heavy checks
    # Standard label only: larger runners are charged even on a public
    # repository (CLAUDE.md section 8).
    runs-on: ubuntu-latest
    # A stop, not a budget. The browser half stops itself first
    # (playwright.config.ts GATE_BUDGET_MS). Since #1280 the coverage run is
    # in this job too -- 482 to 510 s as a step of the required job on the
    # EPYC 7763 -- after checks that took 322 to 521 s in all on the four
    # scheduled runs to 2026-10-12; docs/agents/ci.md section 4c has what this
    # job measured with it.
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        # Pinned to a full commit SHA, as in rules.yml:
        #   gh api repos/actions/checkout/git/ref/tags/v7.0.1 --jq .object.sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Which CPU this run landed on (#864): two runner types with different
      # speeds serve ubuntu-latest, and a duration means nothing without it.
      - name: Record the runner's CPU
        run: lscpu | grep -E '^(Model name|Thread|Core|Socket|CPU\(s\))'

      - name: Set up Node
        #   gh api repos/actions/setup-node/git/ref/tags/v7.1.0 --jq .object.sha
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # rules.yml's `Drop the unrelated Chrome apt source`, for its reason.
      - name: Drop the unrelated Chrome apt source
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources

      - name: Install the pinned Chromium
        run: pnpm --filter @onyourleft/web exec playwright install --with-deps chromium

      - name: Tests outside coverage
        run: pnpm run test:uninstrumented

      # One worker: the realistic loads draw on the CPU through SwiftShader,
      # and two of them side by side took about twice as long each (#651).
      - name: Nightly browser checks
        run: pnpm run test:browser:nightly

      # --- The coverage report (#1280) ----------------------------------------
      #
      # The required job's Vitest files, under coverage. LAST, and
      # `!cancelled()`, so a red check above does not cost the night its
      # report, and a slow report cannot cost the checks above their run. ⚠️ A
      # test that fails HERE turns this job red and opens the nightly issue,
      # and that is meant: these are the required job's own tests, so a failure
      # here and not there is a case that passes only without instrumentation
      # -- a timeout tuned too close (docs/agents/ci.md section 4c), which is worth an
      # issue. The coverage FIGURES gate nothing, here or anywhere.
      - name: Tests under coverage
        if: ${{ !cancelled() }}
        run: pnpm run test:coverage

      # Reported, never gated -- ADR 0005 decision C and CLAUDE.md section 5
      # make the mutation list the gate and forbid a percentage floor. It
      # cannot fail the job: the renderer exits non-zero only when the report
      # is missing or unparseable, and `|| true` keeps even that from turning a
      # reporting step into a gate. `!cancelled()` so a failing suite still
      # publishes what it measured.
      - name: Publish the coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY" || true

      # The full HTML report, for the run where a number in the table above
      # looks wrong and the question is which line.
      #
      # SHA from:
      #   gh api repos/actions/upload-artifact/git/ref/tags/v7.0.1 --jq .object.sha
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  # A red nightly run has to be SEEN, or moving a check here is deleting it.
  # Opens an issue the first time, and comments on it while it stays open.
  report:
    name: Report a red run
    needs: heavy
    # `result` rather than `failure()`: a job stopped by its timeout-minutes
    # ends `cancelled`, not `failed`, and a hung run must be reported too.
    # (A run cancelled by hand is reported as well; that is the cheaper error.)
    if: >-
      always() && github.event_name != 'pull_request' &&
      (needs.heavy.result == 'failure' || needs.heavy.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job's token may write issues and nothing else -- not contents, not
    # pull requests. It checks nothing out and runs no repository code.
    # Reading which step of this run failed (below) needs no more than that
    # on a public repository: measured with this permission block exactly,
    # run 38262275064 (#1285).
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        # One issue for every nightly failure, so the body names the step that
        # went red: since #1280 a test that fails only under coverage lands
        # here beside a browser check and a fuzz case. `cancelled` as well as
        # `failure`, for the step a job's stop cut short. A read that fails
        # must not cost the issue itself, so it falls back to saying so.
        run: |
          title='Nightly heavy checks failed'
          steps=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" \
            --jq '.jobs[] | .name as $job | .steps[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "- \($job): \(.name) (\(.conclusion))"' || true)
          body="The nightly run failed on ${HEAD_SHA}: ${RUN_URL}

          What went red:
          ${steps:-(the steps could not be read; open the run)}

          These checks are not required and cannot block a merge (docs/agents/ci.md section 4c, #866), so this issue is how a break in them is seen. Close it once a nightly run is green again."
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
