# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Android release (#95).
#
# ⚠️ NEVER RUN. No tag has been pushed and no signed build exists — the
# environment this was written in has no Android SDK and cannot reach
# dl.google.com. `apps/mobile/RELEASE.md` §1 is the table of what is enforced and
# what is merely written, and this file is in the second column.
#
# ⚠️ Deliberately NOT a job inside `rules.yml`. CLAUDE.md §4c's rule that a
# second job cannot block a merge is about *gates*; this is not one. It runs on a
# tag, after review, and adding it to the pull-request workflow would run an
# Android build on every pull request for a check nothing depends on.
name: Android release

on:
  push:
    tags:
      - 'v*'
  # So the pipeline can be exercised before there is anything to release —
  # which, per RELEASE.md §1, has not happened yet.
  workflow_dispatch:

# The release job writes a GitHub Release, which needs more than `contents:
# read`. Every other workflow in this repository is read-only and stays that way.
permissions:
  contents: write

jobs:
  build:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to a full commit SHA, never a tag — CLAUDE.md §8. Produced with:
      #   gh api repos/actions/checkout/commits/v5.0.0 --jq .sha
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      #   gh api repos/actions/setup-node/commits/v4.4.0 --jq .sha
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      #   gh api repos/actions/setup-java/commits/v4.7.1 --jq .sha
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'

      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile

      # The shell wraps apps/web's build — capacitor.config.ts sets
      # `webDir: '../web/dist'` — so this has to run before `cap sync` has
      # anything to copy. `cap sync` says so when it has not.
      - run: pnpm --filter @onyourleft/web run build
      - run: pnpm --filter @onyourleft/mobile exec cap sync android

      # ⚠️ Signing is conditional on the secret being present, so a fork can run
      # this workflow and get an installable unsigned artefact without holding
      # any secret at all. A hard requirement here would make the pipeline
      # untestable by anyone but the owner, which is how a release pipeline rots.
      - name: Decode the upload key, if this repository has one
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret; building unsigned."
            exit 0
          fi
          # Written outside the workspace so REL001 cannot be satisfied by
          # accident on a runner and, more importantly, so nothing can commit it.
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/upload.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble
        working-directory: apps/mobile/android
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${SIGNED}" = "true" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="${RUNNER_TEMP}/upload.jks" \
              -Pandroid.injected.signing.store.password="${ANDROID_KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${ANDROID_KEY_ALIAS}" \
              -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD}"
          else
            ./gradlew assembleDebug
          fi

      - name: Remove the key before anything else runs
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload.jks"

      # The AGPL-native distribution path, independent of any store — #95's sixth
      # criterion. It matters more than usual here: RELEASE.md §5 records that
      # Android's developer-verification rollout threatens exactly this route.
      #   gh api repos/softprops/action-gh-release/commits/v2.3.2 --jq .sha
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/mobile/android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
