    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the runner's CPU
        run: lscpu | grep -E '^(Model name|Thread|Core|Socket|CPU\(s\))'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          npm install --global --ignore-scripts corepack@0.36.0
          corepack enable pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Drop the unrelated Chrome apt source
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources

      - name: Install the pinned Chromium
        timeout-minutes: 10
        run: pnpm --filter @onyourleft/web exec playwright install --only-shell chromium

      - name: Browser gate
        timeout-minutes: 14
        run: timeout --verbose --kill-after=10s 825s pnpm run test:browser:shard-5

  # --- The required check ---------------------------------------------------------
  #
  # ⚠️ THE NAME IS LOAD-BEARING. `main` requires a status check whose context is
  # exactly "Repository rules", and this job's `name:` is that context. Rename
  # it and the required check never reports, which makes every pull request
  # unmergeable -- including the one doing the renaming.
  #
  # It does no work of its own: it reads the result of every shard and fails
  # unless each one is `success`. Three things here are each the difference
  # between a gate and a decoration, and nightly-split.test.ts fails on the
  # loss of any of them:
  #
  #   `needs:` names EVERY other job in this file. A shard left out still runs
  #   and still goes red, under a context nothing requires.
  #
  #   `if: always()`. Without it this job is SKIPPED when a shard fails, and
  #   GitHub counts a skipped required check as passing -- the pull request
  #   with a red shard would be mergeable.
  #
  #   The verdict is scripts/check-shard-results.sh over `toJSON(needs)`, which
  #   fails on `failure`, `cancelled` (a shard past its own stop) AND `skipped`
  #   (a shard given an `if:` that was false), and on no shard at all. Its
  #   suite runs in the `checks` shard. Passing the whole `needs` context
  #   rather than naming each result is deliberate: a shard added to `needs:`
  #   is in the verdict without a second edit.
  #
  # No `continue-on-error` anywhere in this file, for the same reason: on a job
  # it reports a failure here as `success`.
  rules:
    name: Repository rules
    needs: [checks, tests-1, tests-2, browser-1, browser-2, browser-3, browser-4, browser-5]
    if: always()
    runs-on: ubuntu-latest
    # A checkout and one bash script: seconds. Five minutes is a stop.
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every shard succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/check-shard-results.sh
