# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Enforce the repository rules that are checkable without a toolchain.
#
# CONTRIBUTING.md tells contributors the SPDX header rule "is linted in CI, so a
# missing or mismatched header fails the build rather than being caught in
# review", and CLAUDE.md says rule SCOPE001 "fails the build". This workflow is
# what makes those statements true. Until it existed they were not.
#
# The first half of the job runs on a bare clone with bash and coreutils and
# needs no toolchain at all. The second half is the workspace gate #23
# established -- install, format, lint, typecheck, test and build. They share one
# job deliberately: `main` requires a status check whose context is exactly
# "Repository rules", so a second job would report under a different context and
# a toolchain failure would not block a merge.
#
# Still not here, and owned by the second half of #24: the per-package
# dependency-licence allowlist, and a coverage gate demonstrated to fail.
name: Repository rules

# `pull_request` runs in the fork's context with a read-only token and no access
# to secrets. Its target-context counterpart -- which does receive secrets and is
# not covered by the fork-approval gate at all -- is banned by CLAUDE.md section
# 8 and enforced by rule WF001 in scripts/check-repo-rules.sh. That rule greps
# this directory for the name, so the name cannot appear here even in a comment.
on:
  pull_request:
  push:
    branches: [main]

# Set explicitly and minimally at workflow level: every step below reads the
# checked-out tree and writes nothing back.
permissions:
  contents: read

# Supersede an in-flight run when a PR is pushed again. At ~7 seconds a run this
# saves nothing today; it is here so the habit predates the toolchain half of
# #24, when a run becomes long enough for two to overlap and the stale one to
# report against code that no longer exists.
#
# Pull requests only. On `main` every commit's run is a record of whether that
# commit was green, and two merges in quick succession would otherwise cancel
# the first -- leaving a commit on the default branch with no completed run
# against it, which is the one place the history matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rules:
    name: Repository rules
    # Standard label only. Larger runners (`4-core`, `8-core`, any `larger`
    # label) are charged even on a public repository, while standard
    # GitHub-hosted runners are free and unlimited -- CLAUDE.md section 8. It is
    # a one-word diff that produces an invoice and nothing in the log warns you.
    runs-on: ubuntu-latest
    # These checks take seconds. The cap is a stop on a hung job rather than a
    # budget; the platform default would let one run for six hours.
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        # Pinned to a full commit SHA, not a tag: a tag is mutable, and a
        # compromised action runs with whatever permissions this job holds.
        # Pinned to a full commit SHA, not a tag: tags are mutable, and a
        # retagged action runs with this job's permissions. Provenance, so a
        # reviewer can check rather than trust:
        #   gh api repos/actions/checkout/git/ref/tags/v7.0.1 --jq .object.sha
        #   -> 3d3c42e5aac5ba805825da76410c181273ba90b1   (verified 2026-09-03)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to survive in
          # .git/config where a later step could reach it.
          persist-credentials: false

      # CLAUDE.md section 4a. Every command below is one that file documents;
      # CI accumulating private knowledge is how a contributor's local green
      # becomes CI's red with no explanation.
      - name: Repository rules (LIC001-4, SCOPE001, WF001, ADR001-3)
        run: bash scripts/check-repo-rules.sh

      - name: Repository rule checker tests
        run: bash scripts/check-repo-rules.test.sh

      # A silent edit to a licence text is a licensing incident, not a typo, and
      # it is the shape of diff a human reviewer scrolls past.
      - name: Licence text integrity (LIC005)
        run: bash scripts/check-licence-hashes.sh

      - name: Licence integrity checker tests
        run: bash scripts/check-licence-hashes.test.sh

      - name: Environment template completeness (ENV001)
        run: bash scripts/check-env-example.sh

      - name: Environment template checker tests
        run: bash scripts/check-env-example.test.sh

      # shellcheck is preinstalled on the standard Ubuntu runner image
      # (0.9.0 on ubuntu-24.04, which `ubuntu-latest` currently resolves to), so
      # there is nothing to install. The version is printed because the runner's
      # is older than a typical developer's and the two can disagree.
      - name: Shell lint
        run: |
          shellcheck --version
          shellcheck scripts/*.sh

      # --- The workspace toolchain, from here down (CLAUDE.md section 4a) ------

      # Reads .nvmrc so the runner and a contributor cannot disagree about the
      # major version. ADR 0005 pins Node 24 "Krypton"; Node 26 becomes Active
      # LTS on 2026-10-28 and the move happens on that date, not before.
      - name: Set up Node
        # Pinned to a full commit SHA, not a tag. Provenance, so a reviewer can
        # check rather than trust:
        #   gh api repos/actions/setup-node/git/ref/tags/v7.0.0 --jq .object.sha
        #   -> 820762786026740c76f36085b0efc47a31fe5020   (verified 2026-09-03)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # pnpm comes from the `packageManager` field via corepack rather than from
      # a third-party setup action, so the version is pinned by the manifest that
      # a contributor also reads and there is one less action to trust.
      #
      # No dependency cache: it would mean a second action to pin and a writable
      # cache in the dependency path of every job, to save a couple of seconds on
      # a workspace this size. Revisit when the install is slow enough to notice.
      - name: Enable pnpm through corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable pnpm
          pnpm --version

      # --frozen-lockfile: fail rather than silently resolve something the
      # committed lockfile does not describe. pnpm 11 also verifies every
      # lockfile entry against its supply-chain policies here.
      #
      # This step runs the install described by the *fork's* checkout on a pull
      # request, so `pnpm-workspace.yaml`'s `allowBuilds` block is a
      # security-relevant file: flipping an entry to `true` is what lets a
      # dependency's install script execute here. What keeps that acceptable is
      # already in place -- `pull_request` rather than its target-context
      # counterpart, `permissions: contents: read`, no secrets in this job,
      # `persist-credentials: false`, and GitHub's first-time-contributor
      # approval gate. Read that block on every fork pull request anyway
      # (CLAUDE.md section 8).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # `test:coverage`, not `test`. ADR 0005 decision C sets no percentage
      # floor and forbids inventing one -- the gate is the mutation list in the
      # pull request body. The report is here because an untested branch is
      # worth seeing in review, and because it costs nothing to print.
      - name: Tests and coverage report
        run: pnpm run test:coverage

      # #48's fourth acceptance criterion: automated accessibility checks run on
      # every route and fail the build on a violation. The checks are Vitest
      # tests, so the step above already ran them and this one runs them again
      # -- deliberately. A failure buried among two hundred other cases is a
      # failure somebody scrolls past; under a step called "Accessibility" it is
      # not. The whole set takes under a second.
      #
      # In this job rather than a job of its own: `main` requires a status check
      # whose context is exactly "Repository rules", and a second job would
      # report under a different one and could not block a merge (CLAUDE.md
      # section 4c).
      #
      # ⚠️ The filter is a path SUBSTRING, and that is weaker than it looks.
      # DELETING apps/web/src/a11y/ fails this step, because Vitest exits
      # non-zero when a filter selects no files. RENAMING it does not: renaming
      # to src/accessibility/ still matches nothing named `a11y`, drops
      # audit.test.ts -- the suite proving every rule actually fires -- and
      # exits 0 with 5 files instead of 6. Measured, not reasoned: 56 tests
      # instead of 94, green.
      #
      # So this gate fails closed against deletion and OPEN against a rename.
      # Making the selection robust is #142; until then, treat a change to the
      # a11y directory's name or layout as a change to this gate.
      - name: Accessibility
        run: pnpm run test:a11y

      # The renderer has logic of its own -- it decides which package a covered
      # file belongs to, from absolute paths that differ between a checkout, a
      # runner and a worktree -- so it has a suite, and the suite runs here. Its
      # first version attributed a dependency's own `packages/<name>/` directory
      # to a workspace package of that name; the suite caught it.
      #
      # Not part of `pnpm run check:repo`: that is the bare-clone set, and this
      # one needs Node.
      - name: Coverage renderer tests
        run: bash scripts/coverage-summary.test.sh

      # Coverage is REPORTED, never gated -- ADR 0005 decision C and CLAUDE.md
      # §5 make the mutation list the gate and forbid a percentage floor. This
      # step exists because the numbers were being computed and then thrown
      # away: `text` goes into this log under the install and build output, and
      # `html` is written to a runner that is destroyed with it.
      #
      # `if: always()` so a failing suite still publishes what it measured --
      # the run where coverage moved unexpectedly is the one you want the table
      # for. It cannot fail the job: the renderer exits non-zero only when the
      # report is missing or unparseable, and `|| true` keeps even that from
      # turning a reporting step into a gate.
      - name: Publish the coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY" || true

      # The full HTML report, for the run where a number in the table above
      # looks wrong and the question is which line.
      #
      # SHA from:
      #   gh api repos/actions/upload-artifact/git/ref/tags/v7.0.1 --jq .object.sha
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

      # A green typecheck is not a green build: the bundler resolves imports the
      # typechecker only reads types from.
      - name: Build
        run: pnpm run build
