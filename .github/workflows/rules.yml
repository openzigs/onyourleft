# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Enforce the repository rules that are checkable without a toolchain.
#
# CONTRIBUTING.md tells contributors the SPDX header rule "is linted in CI, so a
# missing or mismatched header fails the build rather than being caught in
# review", and CLAUDE.md says rule SCOPE001 "fails the build". This workflow is
# what makes those statements true. Until it existed they were not.
#
# Since #1285 the work is done by jobs side by side -- the SHARDS, eight since
# #2376 -- and one more, `rules`, that does nothing but fail unless every one
# of them succeeded. `main` requires a status check whose context is exactly
# "Repository rules", and that last job is the one that carries the name: a
# shard reports under its own context, which `main` does not require, so a red
# shard blocks a merge ONLY through the job at the bottom of this file. The
# owner's ruling of 2026-10-12 (#1280, #1285): one job of 23 minutes on the
# slower runner, growing about 21 s a day, had to stop being one serial run.
#
#   checks   the bare-clone script checks, format, lint, typecheck, the build,
#            every checker and its suite, the instance image, the Capacitor
#            and third-party-notices gates
#   tests-1, tests-2
#            the Vitest suite, divided by Vitest project since #2154: the
#            `web` project in `tests-1`, every other project and the
#            accessibility gate in `tests-2`
#   browser-1 to browser-5
#            the pinned Chromium and the browser gate (#63), a fifth each
#            since #2376 (thirds since #1720, halves since #1362), divided by
#            spec file on measured time: jsdom implements no WebGL, so
#            MapLibre cannot be constructed there at all, and "which hosts
#            does the map engine actually contact" is a question only a
#            browser answers
#
# ⚠️ A new gate goes INSIDE one of those shards. A new job is a new shard, and
# a shard the `rules` job does not `needs` is a gate that cannot block a merge:
# apps/web/browser/nightly-split.test.ts fails on one.
#
# Still not here: a coverage gate. Coverage is reported nightly and never gated
# (ADR 0005 decision C); .github/workflows/nightly.yml takes it.
name: Repository rules

# `pull_request` runs in the fork's context with a read-only token and no access
# to secrets. Its target-context counterpart -- which does receive secrets and is
# not covered by the fork-approval gate at all -- is banned by CLAUDE.md section
# 8 and enforced by rule WF001 in scripts/check-repo-rules.sh. That rule greps
# this directory for the name, so the name cannot appear here even in a comment.
#
# `merge_group` since #2198: `main` merges through GitHub's merge queue, and the
# queue merges a pull request only once the required "Repository rules" check
# has reported on the queue's own `gh-readonly-queue/main/...` ref -- the
# pull request merged with main and with every entry ahead of it. Without this
# trigger that check never reports there and every queued pull request waits
# until the queue's timeout removes it. No job or step here reads a field of
# the pull_request payload (a base SHA, a label, a number), so every one runs
# unchanged under it, against the merge group's commit. Unlike `pull_request`,
# a queue run is in this repository's own context, as a push to `main` is: it
# holds what the push after the merge would, and only a reviewed pull request
# that someone with write access queued reaches it. Nothing below references a
# secret, and the token stays `contents: read`.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Set explicitly and minimally at workflow level: every step below reads the
# checked-out tree and writes nothing back.
permissions:
  contents: read

# Supersede an in-flight run when a PR is pushed again: a stale run reports
# against code that no longer exists, and since #1285 it also holds four
# runners while it does.
#
# Pull requests only. On `main` every commit's run is a record of whether that
# commit was green, and two merges in quick succession would otherwise cancel
# the first -- leaving a commit on the default branch with no completed run
# against it, which is the one place the history matters.
#
# Never a merge-queue run either (#2198): each queue entry has a ref of its own,
# so the group never collides, and a cancelled run there is a required check
# that reports `cancelled` and drops the pull request from the queue. The
# queue removes an entry it no longer needs by itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- Shard 1 of 8: everything that is not Vitest and not a browser ------------
  checks:
    name: Checks
    # Standard label only. Larger runners (`4-core`, `8-core`, any `larger`
    # label) are charged even on a public repository, while standard
    # GitHub-hosted runners are free and unlimited -- CLAUDE.md section 8. It is
    # a one-word diff that produces an invoice and nothing in the log warns you.
    runs-on: ubuntu-latest
    # A stop on a hung job rather than a budget; the platform default would let
    # one run for six hours. docs/agents/ci.md section 4c "Shards -- #1285" has
    # every shard's measured time on the slower runner (an AMD EPYC 7763) and
    # the arithmetic of every stop in this file; nightly-split.test.ts holds
    # each shard's stop at least five minutes clear of the slowest run in that
    # section's table, which it reads rather than repeats. This shard took
    # 250 to 279 s there.
    timeout-minutes: 12
    steps:
      - name: Check out the repository
        # Pinned to a full commit SHA, not a tag: a tag is mutable, and a
        # compromised action runs with whatever permissions this job holds.
        # Pinned to a full commit SHA, not a tag: tags are mutable, and a
        # retagged action runs with this job's permissions. Provenance, so a
        # reviewer can check rather than trust:
        #   gh api repos/actions/checkout/git/ref/tags/v7.0.1 --jq .object.sha
        #   -> 3d3c42e5aac5ba805825da76410c181273ba90b1   (verified 2026-09-03)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to survive in
          # .git/config where a later step could reach it.
          persist-credentials: false

      # docs/agents/commands.md section 4a. Every command below is one that file documents;
      # CI accumulating private knowledge is how a contributor's local green
      # becomes CI's red with no explanation.
      #
      # ⚠️ One step below, `Checks, concurrently`, runs twenty-six §4a commands
      # AT ONCE through scripts/run-concurrently.sh (#651), and a reviewer who
      # remembers one step per command is reading the old file. Those commands
      # are single-threaded and none makes a timing assertion, so side by side
      # INSIDE a step is how they use more than one of the runner's four CPUs;
      # the shards (#1285) are how the three long halves of the old job stopped
      # waiting for each other. The runner
      # labels every line with the command it came from, waits on every process
      # by itself, fails the step if ANY command failed, and prints each failed
      # command's whole output again at the end. Its own suite runs first,
      # before anything is trusted to it: a runner that swallowed a failure
      # would make that step twenty-six gates removed, and look green.
      - name: Concurrency runner tests
        run: bash scripts/run-concurrently.test.sh

      # Which CPU this run landed on (#866, #864). ubuntu-latest is served by
      # more than one CPU model at different speeds, and a step's duration
      # means nothing without it. Not a §4a command; docs/agents/ci.md section 4c
      # records it beside the apt-source step, the other one.
      - name: Record the runner's CPU
        run: lscpu | grep -E '^(Model name|Thread|Core|Socket|CPU\(s\))'

      # --- The workspace toolchain, from here down (docs/agents/commands.md section 4a) ------

      # Reads .nvmrc so the runner and a contributor cannot disagree about the
      # major version. ADR 0005 pins the Active LTS line: Node 26 since its
      # amendment of 2026-10-29 (#1597), the day after 26 entered Active LTS.
      - name: Set up Node
        # Pinned to a full commit SHA, not a tag. Provenance, so a reviewer can
        # check rather than trust:
        #   gh api repos/actions/setup-node/git/ref/tags/v7.1.0 --jq .object.sha
        #   -> 949feb2413d6458794dcd2491c4babbbce0c15c1   (verified 2026-10-15)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # pnpm comes from the `packageManager` field via corepack rather than from
      # a third-party setup action, so the version is pinned by the manifest that
      # a contributor also reads and there is one less action to trust.
      #
      # No dependency cache: it would mean a second action to pin and a writable
      # cache in the dependency path of every job, to save a couple of seconds on
      # a workspace this size. Revisit when the install is slow enough to notice.
      # (#651 measured it: 3 to 5 s. Still not worth an action.)
      #
      # ⚠️ Since Node 26 (#1597) corepack itself comes from npm: Node stopped
      # shipping it with v25, so `setup-node`'s Node has none. It is pinned to
      # an exact version, has no dependencies and no install script, and
      # `--ignore-scripts` holds it to that. The same pin is in every job here,
      # in nightly.yml, release.yml and apps/instance/Dockerfile: move them
      # together.
      - name: Enable pnpm through corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          npm install --global --ignore-scripts corepack@0.36.0
          corepack enable pnpm
          pnpm --version

      # --frozen-lockfile: fail rather than silently resolve something the
      # committed lockfile does not describe. pnpm 11 also verifies every
      # lockfile entry against its supply-chain policies here.
      #
      # This step runs the install described by the *fork's* checkout on a pull
      # request, so `pnpm-workspace.yaml`'s `allowBuilds` block is a
      # security-relevant file: flipping an entry to `true` is what lets a
      # dependency's install script execute here. What keeps that acceptable is
      # already in place -- `pull_request` rather than its target-context
      # counterpart, `permissions: contents: read`, no secret a fork's run is
      # given (since #1231's GHCR mirror the job holds no secret at all),
      # `persist-credentials: false`, and GitHub's first-time-contributor
      # approval gate. Read that block on every fork pull request anyway
      # (docs/agents/toolchain.md section 8).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # None of these commands makes a timing assertion, so they run side by
      # side (#651). Formatting, lint, the typecheck and most checkers are
      # single-threaded; one after another they left most of the runner idle.
      #
      # ⚠️ The bare-clone checks are here too since #651, AFTER the install,
      # though they need none of it. As a concurrent step of their own before
      # the install they took 48 s and this one 106 s (run 36326756014); here,
      # together, 136 s and 139 s (runs 36333257690 and 36334163962), all on the
      # same AMD EPYC 7763 runner. They still need nothing but bash and
      # coreutils, and `check:repo` still runs them on a bare clone.
      #
      #   check-repo-rules -- LIC001-4, LIC006, SCOPE001, WF001, ADR001-4,
      #   SPIKE001-3, REL001-2, XML001-4 and ASSET001-7, and its fixture suite.
      #   check-licence-hashes -- LIC005. A silent edit to a licence text is a
      #   licensing incident, not a typo, and it is the shape of diff a human
      #   reviewer scrolls past.
      #   check-env-example -- ENV001.
      #   check-doc-links -- DOC001/DOC002. Relative links only: an external
      #   URL is not checked, because that would need the network and turn a
      #   bare-clone gate into one that fails on an aeroplane (docs/agents/commands.md §4a).
      #   shellcheck -- preinstalled on the standard Ubuntu runner image (0.9.0
      #   on ubuntu-24.04, which `ubuntu-latest` currently resolves to), so
      #   there is nothing to install. The version is printed because the
      #   runner's is older than a typical developer's and the two can disagree.
      #
      #   format:check, lint, typecheck -- docs/agents/commands.md §4a. Since
      #   #2272 `lint` is scripts/lint.sh: one ESLint process per workspace
      #   project, one after another, because one process for the whole tree
      #   ran out of its 4 GB heap here. Each prints its peak heap beside its
      #   limit. Its suite beside it: a file that falls between the processes,
      #   or a failing process that is swallowed, is a gate removed.
      #
      #   check-a11y-suite.test.sh -- the accessibility checker (below) decides
      #   what counts as an accessibility test from paths and from
      #   package.json's own script, so it has a suite.
      #
      #   check:test-split -- #852. `test:required` leaves the heaviest files
      #   out and `test:uninstrumented` runs exactly them; since #1076 it also
      #   leaves out every `.a11y.test.` file, which `test:a11y` runs. This
      #   asks Vitest what each of the three selects and fails on a file in no
      #   run or in two. Since #1280 it also fails a `test:coverage` -- the
      #   nightly report's run -- that is not `test:required` with
      #   `--coverage`: the report is of the files this job runs. It
      #   lists files and runs no test, so it has no case timeout to miss. Its
      #   suite, for the reason every checker here has one.
      #
      #   check:wiring -- #278. Every other gate looks INSIDE a unit, and five
      #   defects in one week were a correct, unit-tested, typechecked, linted
      #   unit wired to nothing: no device could be paired on Android at all
      #   (#230), there was no pacer (#237), a rider who beat their own best
      #   was never told (#259). An exported function nobody calls and an
      #   optional parameter nobody supplies are both perfectly well typed. This
      #   walks the module graph from the page Vite builds and reports what the
      #   client's own seams cannot reach. Its suite: five of its cases are
      #   #278's five defects, reproduced from the tree as it actually was, and
      #   two of those are green on purpose and named so -- a stated limit
      #   nobody has pinned is a limit that quietly becomes a false claim.
      #
      #   check:cost-model -- #54. docs/cost-model.md states its inputs with
      #   their provenance and what follows from them; this recomputes the
      #   second from the first. Its suite's most important case is the vacuous
      #   pass: a document whose tables parse and are never compared.
      #
      #   coverage-summary.test.sh -- the coverage renderer decides which
      #   package a covered file belongs to, from absolute paths that differ
      #   between a checkout, a runner and a worktree; its first version
      #   attributed a dependency's own `packages/<name>/` directory to a
      #   workspace package of that name, and the suite caught it.
      #
      #   check:licences -- DEP001/DEP002. The other half of the licence
      #   boundary: check-repo-rules.sh checks the headers and manifests of the
      #   code we write, this checks the licence of the code we pull in. It
      #   reads pnpm's own resolution of its own lockfile, so it needs the
      #   install -- which is why it is not in check:repo. ADR 0015 classifies
      #   the licences; docs/agents/licence-gates.md section 4g says what it does and does not
      #   cover.
      #
      #   build -- a green typecheck is not a green build: the bundler resolves
      #   imports the typechecker only reads types from.
      #
      #   demo build -- #1645. The demo's own build (vite.demo.config.ts), whose
      #   plugins are its guarantees: it fails if its bundle holds a trainer,
      #   Bluetooth, network or storage module, if its page's policy cannot
      #   allow its inline script by hash, or if it writes a service worker or
      #   a manifest. Not part of `build`, so a rider's build never waits on it.
      #
      #   check-shard-results.test.sh -- #1285. The suite of the script the
      #   `rules` job at the bottom of this file runs: the required check's
      #   whole verdict. Its cases are the passes that job must not give --
      #   a shard skipped, cancelled, or not there at all.
      #
      #   instance image -- #767/#771. Builds apps/instance/Dockerfile, waits
      #   for the image's own healthcheck to answer /health INSIDE the
      #   container, and requires /source to name the commit (AGPL-3.0 s13).
      #   Mostly a pull of the digest-pinned base image and a few COPY layers,
      #   so it is waiting rather than working and belongs here. The instance's
      #   Vitest project needs no step: it is one more project in the `tests`
      #   shard's run (docs/agents/ci.md section 4c says what that cost). ⚠️ The pull is
      #   from ghcr.io/openzigs/, the project's mirror of Docker Hub's image
      #   (#1231, IMG008), anonymous; the one registry this workflow needs that
      #   nothing else does. An outage of it turns this red as IMG004, which
      #   names the registry rather than the Dockerfile (#841, docs/agents/ci.md
      #   section 4c). Its suite fakes `docker` on PATH and needs no Docker.
      #   mirror script tests -- #1231. The suite of the script
      #   mirror-base-image.yml runs; a fake `skopeo`, no registry.
      #   basemap build script tests -- #1557. The suite of
      #   apps/web/tools/basemap/build.sh; fake `curl`, `git`, `java` and
      #   `mvn`, no network and no tiles.
      #   valhalla build and upload script tests -- #2320. The suites of
      #   apps/web/tools/valhalla/build-graph.sh (a fake `docker`) and
      #   upload.sh (a fake `aws` and `curl`): no image, no bucket, no network.
      #
      # Every one of these is also what it was before #651 in every other way:
      # the same command, and its failure fails the job. Most checkers need
      # Node, which is why none of them is in `check:repo`, the bare-clone set.
      #
      # ⚠️ What is NOT here, and why. Anything that runs Vitest (#651, measured
      # on run 36324592730): Vitest has a 5 s case timeout that several cases
      # already come within a second of on the slower runner alone -- the
      # accessibility gate run beside these went red, three sound cases at
      # 5.0 s. It and the suite are the `tests` shard. Nor the Capacitor gate
      # or the notices gate: each runs its own install and the first creates
      # and removes directories under apps/mobile/android, which does not
      # belong under a linter walking the same tree; they follow this step.
      # ⚠️ Nor, since #1285, `playwright install`: it was here because it is
      # mostly a download, and it is in each browser shard now (`browser-1` and
      # `browser-2` since #1362), the jobs that drive a browser.
      - name: Checks, concurrently
        run: >-
          bash scripts/run-concurrently.sh
          'check-repo-rules' 'bash scripts/check-repo-rules.sh'
          'check-repo-rules tests' 'bash scripts/check-repo-rules.test.sh'
          'check-licence-hashes' 'bash scripts/check-licence-hashes.sh'
          'check-licence-hashes tests' 'bash scripts/check-licence-hashes.test.sh'
          'check-env-example' 'bash scripts/check-env-example.sh'
          'check-env-example tests' 'bash scripts/check-env-example.test.sh'
          'check-doc-links' 'bash scripts/check-doc-links.sh'
          'check-doc-links tests' 'bash scripts/check-doc-links.test.sh'
          'shellcheck' 'shellcheck --version && shellcheck scripts/*.sh'
          'format:check' 'pnpm run format:check'
          'lint' 'pnpm run lint'
          'lint runner tests' 'bash scripts/lint.test.sh'
          'typecheck' 'pnpm run typecheck'
          'accessibility checker tests' 'bash scripts/check-a11y-suite.test.sh'
          'test split' 'pnpm run check:test-split'
          'test split checker tests' 'bash scripts/check-test-split.test.sh'
          'wiring' 'pnpm run check:wiring'
          'wiring checker tests' 'bash scripts/check-wiring.test.sh'
          'cost model' 'pnpm run check:cost-model'
          'cost model checker tests' 'bash scripts/check-cost-model.test.sh'
          'coverage renderer tests' 'bash scripts/coverage-summary.test.sh'
          'dependency licence checker tests' 'bash scripts/check-dependency-licences.test.sh'
          'dependency licences' 'pnpm run check:licences'
          'build' 'pnpm run build'
          'demo build' 'pnpm --filter @onyourleft/web run build:demo'
          'instance image' 'bash scripts/check-instance-image.sh'
          'instance image checker tests' 'bash scripts/check-instance-image.test.sh'
          'mirror script tests' 'bash scripts/mirror-base-image.test.sh'
          'basemap build script tests' 'bash apps/web/tools/basemap/build.test.sh'
          'valhalla build script tests' 'bash apps/web/tools/valhalla/build-graph.test.sh'
          'valhalla upload script tests' 'bash apps/web/tools/valhalla/upload.test.sh'
          'shard results checker tests' 'bash scripts/check-shard-results.test.sh'

      # The generated-artefact gate (#299). `cap sync` writes two files this
      # repository commits, and pnpm's store path carries the PEER version as
      # well as the package's own -- so any Capacitor bump invalidates
      # capacitor.settings.gradle, and #276/#277 did exactly that. Nothing could
      # see it: CI never builds Android, release.yml is tag-triggered and has
      # never run, and the documented local sequence regenerates the file before
      # Gradle reads it, so the person most likely to notice is the one whose
      # workflow guarantees they cannot.
      #
      # This regenerates with `cap update android` and fails if either file
      # changes. It runs its own `pnpm install --frozen-lockfile` first, and that
      # is not ceremony: #298 regenerated from a node_modules nobody had checked
      # against the lockfile and committed a DIFFERENT wrong path. A no-op here,
      # a few hundred milliseconds, because the install step above already ran.
      #
      # ⚠️ It does NOT need the build, and the reason is not obvious: `cap
      # update` falls back to a full `copy` when the copied-build directory
      # is missing, and `copy` refuses to start without apps/web/dist. Both
      # CI runs of this gate's first two commits died on exactly that, in two
      # different ways, because a developer's tree always has the gitignored
      # directories a fresh checkout does not. The checker creates them and
      # removes them again -- see GENERATED_DIRECTORIES before moving this
      # step or concluding it belongs after Build.
      #
      # It needs an install, so it is NOT in `check:repo`, the bare-clone set.
      - name: Capacitor generated files
        run: pnpm run check:capacitor

      # Its own suite, for the reason every checker here has one. Two of its red
      # cases are the drift that actually happened, reproduced from the tree as
      # it was -- including #298's own artefact, where the `core` half of the
      # path is right and the `android` half is wrong, which is what a check
      # comparing one dependency or stopping at the first path would pass.
      - name: Capacitor gate checker tests
        run: bash scripts/check-capacitor-generated.test.sh

      # NOT001-NOT008 (#664). Admitted is not the same as noticed: the
      # dependency-licence gate decides which licences may ship, and says
      # nothing about whether their notices ship with them. This regenerates
      # the app's third-party notices from the installed tree -- the union of
      # every workspace package's distributed closure, read by the same two
      # functions check:licences uses -- and fails when the committed document
      # is not what it writes. It runs its own `pnpm install --frozen-lockfile`
      # first, for #298's reason (docs/agents/generated-and-cost-gates.md section 4k), so it is not in
      # check:repo -- and, for the Capacitor gate's reason, not in the
      # concurrent step either: an install does not belong under a linter
      # walking the same tree.
      - name: Third-party notices checker tests
        run: bash scripts/check-third-party-notices.test.sh

      - name: Third-party notices
        run: pnpm run check:notices

  # --- Shards 2 and 3 of 8: everything that is Vitest, in two parts (#2154) -----
  #
  # The accessibility gate and the suite, alone on their runners. Not side by
  # side with anything else: Vitest keeps three of the four CPUs busy and has
  # a 5 s case timeout that several cases come within a second of on the
  # slower runner (#651).
  #
  # ⚠️ TWO jobs since #2154, and a reviewer who remembers one `tests` shard is
  # reading the old file. One job ran the whole suite, and on 2026-11-04 it
  # took 739 to 954 s of its 960 s stop on `main` and was cancelled at it on
  # two pull requests with every test green (run 41911049968). The suite is
  # divided by Vitest PROJECT, which is how it was measured to divide: of
  # 1 940 s of summed case time on the EPYC 7763 (`main` run 41886972871),
  # the `web` project held 1 170 s and every other project 770 s, so `web` is
  # `tests-1`'s part and the rest is `tests-2`'s, with the accessibility gate
  # (also `web`, 64 to 88 s) beside the smaller part. docs/agents/ci.md
  # section 4c "Two Vitest shards -- #2154" has the measurements.
  #
  # `check:test-split` (in the `checks` shard) is what holds that every test
  # file runs exactly once across this workflow and the nightly one: it asks
  # Vitest what `test:a11y`, `test:required` and `test:uninstrumented` each
  # select and fails a file in none or in two, and since #2154 that the
  # required run's parts, `test:required:shard-1` and `-2`, are each
  # `test:required` with a `--project` filter, select at least one file each,
  # and between them every file it selects exactly once. A NEW Vitest project
  # lands in `tests-2` without an edit here: its pattern is `!web`.
  # nightly-split.test.ts fails if a part's command, or the accessibility
  # gate, leaves these two jobs.
  tests-1:
    name: Tests (1 of 2)
    runs-on: ubuntu-latest
    # @see the `checks` shard's stop, and docs/agents/ci.md section 4c "Shards
    # -- #1285". ⚠️ NOT a bound on a Vitest hang: Vitest cannot interrupt a
    # synchronous case, so one that never returns runs until this cancels the
    # job, and the `rules` job then reports the cancelled shard as red.
    # 16 minutes since #1720, and NOT raised by #2154, which divided the run
    # instead: a stop is not a budget. nightly-split.test.ts holds it five
    # minutes clear of the slowest run in section 4c's table.
    timeout-minutes: 16
    steps:
      - name: Check out the repository
        # Pinned to a full commit SHA, as in the `checks` shard, which has the
        # provenance.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each shard is its own runner, so each prints its own CPU: a shard's
      # duration means nothing without it (#866, #864).
      - name: Record the runner's CPU
        run: lscpu | grep -E '^(Model name|Thread|Core|Socket|CPU\(s\))'

      # The toolchain, exactly as in the `checks` shard: .nvmrc, pnpm from the
      # `packageManager` field through corepack, and a frozen install with no
      # dependency cache (3 to 5 s, #651).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          npm install --global --ignore-scripts corepack@0.36.0
          corepack enable pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `test:required`, not `test` and -- since #1280 -- not `test:coverage`.
      # ⚠️ THIS STEP TAKES NO COVERAGE, and a reviewer who remembers a coverage
      # table in this job's summary is reading the old file. The owner's ruling
      # of 2026-10-12 (#1280): V8's instrumentation cost this step 106 to 133 s
      # on the EPYC 7763 (364 s and 376 s without it against 482 s to 497 s
      # with, run 38243281606), the job was being cancelled at its stop with
      # every test green, and coverage is REPORTED, never gated (ADR 0005
      # decision C sets no percentage floor and forbids inventing one -- the
      # gate is the mutation list in the pull request body). So the report is
      # taken by `test:coverage` in .github/workflows/nightly.yml, over the
      # same files, and published in that run's summary with its HTML as an
      # artefact. EVERY TEST THAT RAN HERE STILL RUNS HERE: `test:required` is
      # `test:coverage` without the flag, and `check:test-split` fails the two
      # if their excludes differ. What a pull request loses is the table.
      #
      # ⚠️ NOT on one runner with the browser gate, and that was measured rather
      # than assumed (#651). They are the two longest steps and it was the
      # obvious move; run 36323764725 did it and went red on BOTH halves. Each
      # is CPU-bound on its own -- Vitest keeps three of the four CPUs busy, and
      # SwiftShader draws the game on the CPU -- so together the plain game
      # page's load passed its case's 60 s, and two Vitest cases that take
      # 3.5 to 4.4 s alone passed their 5 s. Two gates that go red because of
      # each other are not two gates. Since #1285 each has a runner of its own,
      # which is the same separation without one waiting for the other.
      #
      # ⚠️ Since #852 it is NOT the whole suite. The two heaviest files -- the
      # #545 near-field rides and the FIT decode fuzz -- spent about 300 s of
      # this step's summed test time under V8's instrumentation, which slows
      # their hot loops about three times, so this step excludes them
      # and `test:uninstrumented` runs them with none. They gate exactly as
      # before; the coverage REPORT stops counting what those two files alone
      # execute, which section 5 says is a signal and not a gate. `check:test-split`,
      # in the `checks` shard, is what stops the two lists coming apart
      # -- a file in no run is a file CI never runs. ⚠️ Since #866 those
      # two files run in the NIGHTLY workflow, not in this job (below), and
      # since #1076 so does realistic-textures.test.ts. Since #1076 this step
      # also excludes the `.a11y.test.` files, which the Accessibility step
      # runs (in `tests-2` since #2154), so they run once rather than twice.
      #
      # ⚠️ Since #2154 this is the `web` project's part of that run, and the
      # other projects' part is `tests-2`'s; `pnpm run test:required` is still
      # the whole run, locally.
      - name: Tests
        run: pnpm run test:required:shard-1

  tests-2:
    name: Tests (2 of 2)
    runs-on: ubuntu-latest
    # @see `tests-1`'s stop.
    timeout-minutes: 16
    steps:
      - name: Check out the repository
        # Pinned to a full commit SHA, as in the `checks` shard, which has the
        # provenance.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each shard is its own runner, so each prints its own CPU: a shard's
      # duration means nothing without it (#866, #864).
      - name: Record the runner's CPU
        run: lscpu | grep -E '^(Model name|Thread|Core|Socket|CPU\(s\))'

      # The toolchain, exactly as in the `checks` shard: .nvmrc, pnpm from the
      # `packageManager` field through corepack, and a frozen install with no
      # dependency cache (3 to 5 s, #651).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          npm install --global --ignore-scripts corepack@0.36.0
          corepack enable pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # #48's fourth acceptance criterion: automated accessibility checks run on
      # every route and fail the build on a violation. The checks are Vitest
      # tests, and they run HERE, in a step of their own: a failure buried
      # among two hundred other cases is a failure somebody scrolls past; under a step called
      # "Accessibility" it is not. ⚠️ Until #1076 the Vitest step below ran all
      # of them a second time, about 43 s on the EPYC 7763; it excludes them
      # since the owner's ruling of 2026-10-03, so they run once, here, and the
      # coverage REPORT (nightly since #1280) stops counting what only they
      # execute (CLAUDE.md section 5). `check:test-split` fails a file in no
      # run or in two.
      #
      # The filter is a path substring, and until #142 it was the DIRECTORY
      # name. That failed closed against deleting apps/web/src/a11y/ -- Vitest
      # exits non-zero when a filter selects no files -- and OPEN against
      # renaming it: renaming to src/accessibility/ matched nothing named
      # `a11y`, dropped audit.test.ts (the suite proving every rule actually
      # fires) and exited 0 with 6 files and 61 tests instead of 7 and 101.
      # Measured on this branch, not reasoned about.
      #
      # It is now `.a11y.test.`, which matches the FILENAME. No directory rename
      # can drop a file out of the gate, and a file added under the convention
      # is picked up without editing this workflow.
      #
      # The check that runs first closes the remaining hole: a genuine
      # accessibility test named without the convention would be silently
      # outside the gate, so check-a11y-suite.mjs compares what Vitest selects
      # against what is on disk and fails on a difference. It runs BEFORE the
      # gate, so a mis-scoped gate is reported as that rather than as a green
      # run over fewer files.
      #
      # Alone, since #651: see the Vitest shards' comment for why. Beside the
      # smaller part of the suite since #2154.
      - name: Accessibility
        run: |
          pnpm run check:a11y-suite
          pnpm run test:a11y

      # Every project but `web`: @see `tests-1`'s `Tests` step.
      - name: Tests
        run: pnpm run test:required:shard-2

      # ⚠️ The other half of #852's split, `test:uninstrumented`, is NOT here
      # since #866: it runs NIGHTLY (.github/workflows/nightly.yml), which is
      # not a required check and cannot block a merge. A reviewer who remembers
      # a `Tests outside coverage` step here is reading the old file.
      # `check:test-split` still fails a file in no Vitest run.

  # --- Shards 4 to 8 of 8: the browser gate (#63), in five parts (#1362, #1720, #2376)
  #
  # It buys the only assertions in the repository that a real engine makes:
  # that MapLibre initialises against the style we build, that `addProtocol`
  # takes effect, and that the map contacts no host but the configured basemap
  # origin. `map/port.ts` records why everything else is behind a seam.
  #
  # ⚠️ A job of its own since #1285, and a reviewer who remembers "a second job
  # reports under a different context and could not block a merge" is reading
  # the old file. That sentence is still true of each browser shard's OWN
  # context, `Browser gate (1 of 2)` and `Browser gate (2 of 2)` since #1362,
  # which `main` does not require. What makes them a gate is the `rules` job
  # below, which `needs` both and fails unless each succeeded.
  #
  # ⚠️ TWO jobs since #1362, and a reviewer who remembers one `browser` shard
  # is reading the old file. One was the long pole: its `chromium` run took 690
  # to 708 s of its 720 s stop on the EPYC 7763 (main, 2026-10-13 to -15), and
  # on run 38656925947 it reached the stop with one case not run, which turned
  # the required check red on a docs-only pull request. So the `chromium`
  # project is divided with Playwright's `--shard` between `test:browser:shard-1`
  # here and `test:browser:shard-2` in `browser-2`, which also runs the `game`
  # project after its half. Every stop is the one the single job had, now over
  # half the cases. docs/agents/ci.md section 4c "Two browser shards -- #1362"
  # has the measurements; nightly-split.test.ts holds that each shard script
  # runs in exactly one job, that together they are `test:browser` with every
  # case in exactly one shard, and that `rules` needs both.
  #
  # ⚠️ THREE jobs since #1720, and divided by SPEC FILE rather than by
  # `--shard`, and a reviewer who remembers `--shard 1/2` is reading the old
  # file. `--shard` divides by case count, and `browser-1` held 924 cases and
  # about two thirds of the `chromium` time: 618 s of its 720 s stop on an EPYC
  # 7763, 1.16 times. Each `test:browser:shard-N` now names its spec files,
  # chosen from per-file times measured on `main` so the three finish
  # together, and `browser-3` runs the `game` project after its part.
  # nightly-split.test.ts holds every spec the `chromium` project reads in
  # exactly one shard's list, and goes red on a spec in none, so a NEW spec
  # file goes into a list in the same pull request (docs/agents/ci.md
  # section 4c "Three browser shards -- #1720" says which).
  #
  # ⚠️ FIVE jobs since #2376, and a reviewer who remembers three is reading the
  # old file. `browser-2` reached its 720 s stop on 2026-11-08 and took a
  # merge-queue entry out with it (run 42511044605), and its part and
  # `browser-1`'s took 654 to 714 s on the slower runners. One spec file,
  # `ride.browser.spec.ts`, was 598 to 637 s of `browser-1` in one worker, so
  # it is two files now (`ride-conditions.browser.spec.ts` is the second
  # half, nothing inside a case changed), and the lists were drawn again from
  # every file's time in its worker over eleven runs, so that each part is
  # under 70 % of its stop at the slowest time measured for every one of its
  # files. Four parts would have been about 465 s each at those times, 65 %,
  # with the slowest runner seen still past 70 %; five are about 370 s, and
  # 448 s for the part whose one worker runs `ride-room.browser.spec.ts`.
  # The demo's two specs, which draw the realistic world, share a part with
  # no spec that opens the ride harness (nightly-split.test.ts holds it).
  # No stop moved. docs/agents/ci.md section 4c "Five browser shards --
  # #2376" has the measurements.
  browser-1:
    name: Browser gate (1 of 5)
    runs-on: ubuntu-latest
    # @see the `checks` shard's stop. The stops nested inside this one, on the
    # slower runner (docs/agents/ci.md section 4c "Shards -- #1285" has the
    # runs): the browser install has its own ten minutes; the gate's step
    # runs under `timeout` for 825 s (playwright.config.ts GATE_STEP_MS) with
    # its own `timeout-minutes: 14` (840 s) behind that; and after it come
    # only the post steps. So with the install at its stop and the gate at
    # its own, the last step ends by about 20 + 600 + 840 + 4 = 1 464 s, inside
    # this job's 1 500: a hang in either ends as a red, named STEP and never
    # as a cancelled job. nightly-split.test.ts holds that sum, and holds the
    # gate's stop at least three minutes inside this from the latest start
    # measured (48 s). The shard itself took 705 to 757 s on the slower
    # runner, so this is not what bounds a green run: the required check
    # reported 723 to 772 s after the run began.
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        # Pinned to a full commit SHA, as in the `checks` shard, which has the
        # provenance.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each shard is its own runner, so each prints its own CPU: a shard's
      # duration means nothing without it (#866, #864).
      - name: Record the runner's CPU
        run: lscpu | grep -E '^(Model name|Thread|Core|Socket|CPU\(s\))'

      # The toolchain, exactly as in the `checks` shard: .nvmrc, pnpm from the
      # `packageManager` field through corepack, and a frozen install with no
      # dependency cache (3 to 5 s, #651).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          npm install --global --ignore-scripts corepack@0.36.0
          corepack enable pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ⚠️ The runner image pre-configures Google's own Chrome apt repository for
      # the Chrome it ships, and `--with-deps` runs `apt-get update` across EVERY
      # configured source before it installs anything -- so one unrelated
      # publisher having a bad afternoon fails the browser install. On
      # 2026-09-09 that repository served a `Release` file regenerated at 17:16
      # UTC alongside a `Packages.gz` last modified at 09:41, and apt refused the
      # mismatch:
      #
      #   Err https://dl.google.com/linux/chrome-stable/deb stable/main amd64 Packages
      #     Hash Sum mismatch
      #   E: Failed to fetch .../binary-amd64/Packages.gz  Hash Sum mismatch
      #   Failed to install browsers
      #   Error: Installation process exited with code: 100
      #
      # It failed byte-identically on a re-run, so it is not a mirror mid-sync
      # that settles on its own, and it would fail the same way on `main`: the
      # broken source is in the image, not in any diff.
      #
      # Nothing here uses that repository. The browser under the gate is the one
      # `@playwright/test` pins, fetched from Playwright's own CDN by the browser
      # install below, and every shared library `--with-deps` installs comes
      # from Ubuntu's archives. So dropping the source removes a third-party
      # publisher from the set this job trusts *as well as* unblocking it --
      # after this step CI depends on strictly less than it did before.
      #
      # Both spellings, because the image names it `.list` today and apt's
      # deb822 format would name it `.sources`; `rm -f` because a missing file
      # is this step's desired outcome rather than an error. It runs before
      # the step that installs the browser. ⚠️ Since #2207 nothing in this
      # workflow runs apt, so here it is a no-op kept as a guard, as it is in
      # nightly.yml since #2209; it is still load-bearing in demo-video.yml,
      # whose ffmpeg comes from apt, and which points at this comment.
      - name: Drop the unrelated Chrome apt source
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources

      # Chromium only, and pinned by the lockfile: @playwright/test 1.63.0
      # ships Chromium revision 1243 and `playwright install` fetches exactly
      # that. (#206 took this from 1.56.0/1194; docs/agents/ci.md section 4c
      # requires these two numbers to move together and to be updated in the
      # same pull request as the bump.) ⚠️ A step of its own since #1285 (it
      # was one of `Checks, concurrently`'s commands, where it had three CPUs'
      # worth of company), with a stop of its own, so the latest the gate can
      # start is a number this file states.
      #
      # ⚠️ No `--with-deps` since #2207, and `--only-shell`. Every timed-out
      # install (three on 2026-11-05, each at this step's ten minutes) spent
      # its time in apt: `--with-deps` downloaded 21.9 MB of fonts the image
      # lacks from the runner's Ubuntu mirror at 30 to 40 kB/s, while
      # Playwright's CDN served all three browser archives in about 6 s. The
      # image already has every shared library a headless Chromium needs (apt
      # reported each one "already the newest version"), and the app bundles
      # its own font, Barlow, so the step now asks apt for nothing; a library
      # a future image drops fails the gate's first launch with Playwright's
      # "Host system is missing dependencies", red and named. `--only-shell`
      # because a headless run with no `channel` launches the headless shell,
      # never the full Chromium (nightly-split.test.ts holds both). Not a
      # cache: the CDN half was never slow, and a restore costs what the
      # download does. docs/agents/ci.md section 4c "The browser install --
      # #2207" has the times before and after. The ten-minute stop is
      # unchanged; it is now only a stop on a hung CDN.
