<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>On Your Left</title>
    <!-- #405. The manifest is a static file in `public/`, copied verbatim into
         `dist` by Vite, so it carries no SPDX header: `.webmanifest` is on
         neither LIC001's nor LIC002's scanned extension list and a JSON
         document has nowhere to put a comment. Its icons are binaries and
         `ASSETS.toml` is what records those. `src/offline/manifest.test.ts`
         asserts this link and the colour below against the manifest and the
         design tokens, in both directions. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- #672. The page has two palettes: this tells the browser so before any
         stylesheet has loaded, so the canvas it paints first and its own
         controls match the device. The script that picks the palette is not
         typed here: `tools/theme/theme-selection-plugin.ts` writes it straight
         after the charset in every build, from `src/design/theme-selection.ts`,
         where the key it reads is also written. It points the two metas below
         at the palette in force; `src/offline/manifest.test.ts` holds each
         colour to `tokens.ts` §`themeColour`. -->
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#0b5c55"
      media="(prefers-color-scheme: light)"
      data-oyl-theme="light"
    />
    <meta
      name="theme-color"
      content="#2b3433"
      media="(prefers-color-scheme: dark)"
      data-oyl-theme="dark"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
