<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>On Your Left — game renderer browser harness</title>
    <style>
      /* Same reason as the map harness: a canvas in a zero-height container
         renders zero pixels, which is indistinguishable from a renderer that
         never acquired a context. */
      #world {
        height: 400px;
        width: 600px;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <script type="module" src="./game-harness.ts"></script>
  </body>
</html>
