<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>On Your Left — map browser harness</title>
    <style>
      /* The map has no intrinsic size. A container with no height renders zero
         pixels, which looks exactly like a map that failed to initialise. */
      #map {
        height: 400px;
        width: 600px;
      }
      /* #2006: `design/theme.css` §`.oyl-map__waypoint`'s size, without its
         colours, so a pointer can find a marker. Where it is placed is the
         adapter's, unmirrored — that is under test. */
      .oyl-map__waypoint {
        height: 20px;
        width: 20px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
