# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The project's first instance, on the owner's own machine (#807, ADR 0037
# D-8): the instance, its deploy-time migrate step, a scheduled backup, and
# ONE remote path, which dials OUT so the router opens no port (ADR 0079):
#
#   - `tailscale` (profile `tailscale`, #2805): the owner's tailnet, served by
#     `tailscale serve` at https://<machine>.<tailnet>.ts.net. Needs no domain.
#   - `tunnel` (profile `cloudflare`): `cloudflared`, for an owner with a
#     domain on Cloudflare.
#
# COMPOSE_PROFILES in `.env` turns one on; `deploy.sh` refuses both at once,
# because an instance has one origin (ADR 0079 D-8). With neither, the
# instance is reachable on this machine only.
# `docs/self-hosting/home-machine.md` is the guide; `deploy.sh` beside this
# file is the one command (#52).
#
# Every variable is in `.env` beside this file (copy `instance.env.example`;
# the repository's own `.env.example` lists each, ENV001). The tunnel token
# and a Tailscale auth key are secrets: they live in that file on the box and
# nowhere else.
#
# ⚠️ NOTHING PUBLISHES A PORT but the admin pages' loopback listener, on the
# HOST'S LOOPBACK ONLY (127.0.0.1:8788, #2643), and the one line marked LOCAL
# DEBUGGING ONLY, commented out. The remote path reaches the instance over this
# project's own network, by name; nothing outside reaches it any other way.

name: onyourleft

x-instance-image: &instance-image
  image: ${OYL_INSTANCE_IMAGE:-onyourleft-instance:local}

services:
  # The deploy's migrate step (#791): runs to completion before the instance
  # starts, and the instance never migrates. A box coming back from a reboot
  # does not re-run it — Docker restarts the instance itself — and the
  # instance waits, not ready, if a migration is somehow still running.
  migrate:
    <<: *instance-image
    command: ['node', 'src/operator/cli.ts', 'migrate']
    volumes:
      - data:/data
    restart: 'no'
    # The image's healthcheck asks the SERVER, which this does not run.
    healthcheck:
      disable: true

  instance:
    <<: *instance-image
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      OYL_INSTANCE_ORIGIN: ${OYL_INSTANCE_ORIGIN:?set OYL_INSTANCE_ORIGIN to the instance's one address, https://<machine>.<tailnet>.ts.net or the tunnel's public hostname}
      # The name the app shows, and where a MODIFIED build's source is (the
      # repository's .env.example says what each means). Empty: no name, and
      # the source is this build's commit.
      OYL_INSTANCE_NAME: ${OYL_INSTANCE_NAME:-}
      OYL_INSTANCE_SOURCE_URL: ${OYL_INSTANCE_SOURCE_URL:-}
      OYL_INSTANCE_REGISTRATION: ${OYL_INSTANCE_REGISTRATION:-approval}
      OYL_INSTANCE_ROOM_WORKERS: ${OYL_INSTANCE_ROOM_WORKERS:-}
      OYL_INSTANCE_WS_COMPRESSION: ${OYL_INSTANCE_WS_COMPRESSION:-off}
      OYL_INSTANCE_METRICS: ${OYL_INSTANCE_METRICS:-off}
      OYL_INSTANCE_METRICS_TOKEN: ${OYL_INSTANCE_METRICS_TOKEN:-}
      # #2641: the instance's own admin pages at /admin, off unless .env says on.
      OYL_INSTANCE_ADMIN_PAGES: ${OYL_INSTANCE_ADMIN_PAGES:-off}
      # #2643: the admin pages on the server machine, at http://localhost:8788,
      # on a listener of their own; the `ports:` line below publishes it.
      # #2784 (ADR 0080 D-1): 8788 unless .env says otherwise, the same as that
      # line, because the first-run setup is served there too, at
      # http://localhost:8788/setup, while the admin pages are still off.
      OYL_INSTANCE_ADMIN_LOOPBACK_PORT: ${OYL_INSTANCE_ADMIN_LOOPBACK_PORT:-8788}
      # #2643: the only addresses a sign-in THROUGH THE REMOTE PATH is taken
      # from, read from the client-address header below. Empty (the default):
      # any — the WAF rule, or the tailnet, is what keeps others out. Not asked
      # on the server machine.
      OYL_INSTANCE_ADMIN_ADDRESSES: ${OYL_INSTANCE_ADMIN_ADDRESSES:-}
      # cloudflared's `/ready` (#2604), asked for the owner's Status: its
      # address on `tunnel_metrics` below unless .env names one (#2918), so it
      # follows OYL_TUNNEL_METRICS_PREFIX. Set EMPTY in .env: the tunnel shows
      # as "not known" and nothing is asked.
      OYL_INSTANCE_TUNNEL_READY_URL: ${OYL_INSTANCE_TUNNEL_READY_URL-http://${OYL_TUNNEL_METRICS_PREFIX:-172.30.88}.10:20241/ready}
      # The room's WebSocket ping (25 s when empty). `0` turns it off, for
      # measuring the tunnel's idle timeout only (home-machine.md, "Measuring
      # the tunnel"); remove it again afterwards.
      OYL_INSTANCE_PING_INTERVAL_MS: ${OYL_INSTANCE_PING_INTERVAL_MS:-}
      # A quiet analysis stream's heartbeat (25 s when empty). `0` is ONLY for
      # #1105's control measurement, never to run with (.env.example).
      OYL_INSTANCE_ANALYSIS_HEARTBEAT_MS: ${OYL_INSTANCE_ANALYSIS_HEARTBEAT_MS:-}
      # The moderator's device key. The deputy's is optional and usually
      # empty: an instance has one moderator (#905, docs/moderation.md).
      OYL_INSTANCE_OWNER_KEY: ${OYL_INSTANCE_OWNER_KEY:-}
      OYL_INSTANCE_DEPUTY_KEY: ${OYL_INSTANCE_DEPUTY_KEY:-}
      OYL_INSTANCE_PUBLIC_ROOM_MIN_ACCOUNT_DAYS: ${OYL_INSTANCE_PUBLIC_ROOM_MIN_ACCOUNT_DAYS:-}
      OYL_INSTANCE_PUBLIC_ROOM_MIN_RIDES: ${OYL_INSTANCE_PUBLIC_ROOM_MIN_RIDES:-}
      # The legal and contact page, /legal (#908) — .env.example says what each
      # names. The contact address is `:?`, required (#2857): the page tells
      # riders and anybody with a complaint to write to it, so it is the
      # operator's own, typed into .env, and never a default — the template
      # ships it empty (BUNDLE005). Public rooms stay off unless .env turns
      # them on, and on refuses to start without an accountable person too.
      OYL_INSTANCE_CONTACT_EMAIL: ${OYL_INSTANCE_CONTACT_EMAIL:?set OYL_INSTANCE_CONTACT_EMAIL in .env to an email address you read, because this server's /legal page tells its riders and anybody with a complaint to write to it}
      OYL_INSTANCE_CONTACT_LANGUAGES: ${OYL_INSTANCE_CONTACT_LANGUAGES:-}
      OYL_INSTANCE_ACCOUNTABLE_PERSON: ${OYL_INSTANCE_ACCOUNTABLE_PERSON:-}
      OYL_INSTANCE_LEGAL_REPRESENTATIVE: ${OYL_INSTANCE_LEGAL_REPRESENTATIVE:-}
      OYL_INSTANCE_PRIVACY_POLICY_URL: ${OYL_INSTANCE_PRIVACY_POLICY_URL:-}
      # The terms of service (#909): a path INSIDE the container, so mount the
      # file there; empty publishes none.
      OYL_INSTANCE_TERMS_FILE: ${OYL_INSTANCE_TERMS_FILE:-}
      OYL_INSTANCE_TERMS_VERSION: ${OYL_INSTANCE_TERMS_VERSION:-}
      OYL_INSTANCE_PUBLIC_ROOMS: ${OYL_INSTANCE_PUBLIC_ROOMS:-off}
      # #2805 (ADR 0079): which remote path this is — tailnet, funnel or
      # cloudflare — and the ONE setting that decides it. `funnel` answers
      # every /admin path not_found on the public listener (D-3), and picks
      # the serve configuration below. Empty: none is named.
      OYL_INSTANCE_REMOTE_PATH: ${OYL_INSTANCE_REMOTE_PATH:-}
      # Every connection's peer is the remote path's proxy, so the rate limits
      # read the rider's own address from the header that proxy writes (#895,
      # B3) — and believe it ONLY from the proxies' own addresses below (#891,
      # #903 item 4): another container on this network, or a port published
      # for local debugging, arrives from somewhere else and is counted as
      # itself. cf-connecting-ip behind Cloudflare; x-forwarded-for behind
      # `tailscale serve`, which REPLACES any copy the client sent (#2805,
      # measured). The instance refuses a remote path with the other one.
      # The addresses: cloudflared's on both its networks (#2604: Docker's DNS
      # may answer `instance` with either), and the `tailscale` service's,
      # each from its network's prefix in .env (#2918), as `networks:` below.
      OYL_INSTANCE_CLIENT_ADDRESS_HEADER: ${OYL_INSTANCE_CLIENT_ADDRESS_HEADER:-cf-connecting-ip}
      OYL_INSTANCE_TRUSTED_PROXIES: ${OYL_NETWORK_PREFIX:-172.30.87}.10,${OYL_TUNNEL_METRICS_PREFIX:-172.30.88}.10,${OYL_NETWORK_PREFIX:-172.30.87}.11
      # The history index (#835, ADR 0040): http://ollama:11434 with the
      # `ollama` service below running; empty, and the index is off.
      OYL_INSTANCE_EMBEDDING_URL: ${OYL_INSTANCE_EMBEDDING_URL:-}
      OYL_INSTANCE_EMBEDDING_MODEL: ${OYL_INSTANCE_EMBEDDING_MODEL:-}
      OYL_INSTANCE_EMBEDDING_DOCUMENT_PREFIX: ${OYL_INSTANCE_EMBEDDING_DOCUMENT_PREFIX:-}
      OYL_INSTANCE_EMBEDDING_QUERY_PREFIX: ${OYL_INSTANCE_EMBEDDING_QUERY_PREFIX:-}
      # The analysis model (#1096, ADR 0046 D-9): http://ollama:11434/v1 with
      # the `ollama` service below running and a model pulled into it; empty,
      # and analysis is off. No model is named here, or anywhere (ADR 0031 D-4).
      OYL_INSTANCE_ANALYSIS_MODEL_URL: ${OYL_INSTANCE_ANALYSIS_MODEL_URL:-}
      OYL_INSTANCE_ANALYSIS_MODEL: ${OYL_INSTANCE_ANALYSIS_MODEL:-}
      OYL_INSTANCE_ANALYSIS_MODEL_REASONING_TOKENS: ${OYL_INSTANCE_ANALYSIS_MODEL_REASONING_TOKENS:-}
      OYL_INSTANCE_PICTURE_MODEL: ${OYL_INSTANCE_PICTURE_MODEL:-}
      # The secret a hosted model key (#1097) and the instance's own keys
      # (#1189) are encrypted under: HERE and on no other service. The `backup` service below deliberately does not get
      # it, so nothing that writes a snapshot holds the secret that opens the
      # key in it (docs/operating-an-instance.md, "A hosted model key").
      # OPTIONAL since #2781, for an existing install: empty, the instance
      # makes it on its first start in `secrets/instance-secret-key` (below).
      OYL_INSTANCE_SECRET_KEY: ${OYL_INSTANCE_SECRET_KEY:-}
      # #2781 (ADR 0080 D-4): where a secret .env leaves empty is kept — the
      # secret key, and the metrics token with metrics on — made there on the
      # first start, owner-only, and read on every later one. The mount
      # below, never the `data` volume the backups copy.
      OYL_INSTANCE_SECRETS_DIR: /run/secrets/onyourleft
      # Voice on Discord (#874): your own bot's token and your own server's id.
      # Both empty is no voice, and nothing else changes; one without the
      # other refuses to start. The token is a secret and is NOT in the
      # environment (#2146): it is the file `secrets/discord-bot-token` beside
      # this one, mounted below, and .env names its path in the container,
      # /run/secrets/onyourleft/discord-bot-token (docs/operating-an-instance.md,
      # "Voice on Discord").
      OYL_INSTANCE_DISCORD_BOT_TOKEN_FILE: ${OYL_INSTANCE_DISCORD_BOT_TOKEN_FILE:-}
      OYL_INSTANCE_DISCORD_GUILD_ID: ${OYL_INSTANCE_DISCORD_GUILD_ID:-}
    volumes:
      - data:/data
      # #2146: this box's secrets for the instance, on no other service — the
      # `backup`, `migrate` and `tunnel` services do not mount it, so no
      # snapshot holds the bot token or the secret key, and cloudflared cannot
      # read them. WRITABLE since #2781 (ADR 0080 D-4, Q-5), because the
      # instance makes its secret key here on its first start. A release
      # bundle ships the folder (#2818) and `deploy.sh` makes a missing one:
      # Docker would make it owned by root on Linux, where the instance, uid
      # 1000, could not write it.
      - ./secrets:/run/secrets/onyourleft
    # Docker waits this long after SIGTERM before it kills the instance: the
    # rooms are told the server is stopping and final results written first.
    stop_grace_period: 20s
    # The project's network, and the tunnel's metrics network (#2604), which
    # only the instance and the tunnel are on.
    networks:
      - default
      - tunnel_metrics
    # LOCAL DEBUGGING ONLY — never with a remote path pointing here:
    # ports: ['127.0.0.1:8787:8787']
    #
    # #2643 (ADR 0069 D-5): the admin pages' loopback listener, published on
    # the HOST'S LOOPBACK ONLY, the same port both sides (the instance checks
    # `Host: localhost:<port>` against the port it listens on). ⚠️ NEVER
    # `0.0.0.0` and never a remote path's target. It refuses a connection from
    # cloudflared's and tailscale's own addresses (OYL_INSTANCE_TRUSTED_PROXIES),
    # but on Docker Desktop any container can still reach a loopback-published port
    # through `host.docker.internal`, arriving from Docker's gateway like the
    # host's own browser does: docs/operating-an-instance.md, "Admin pages on
    # the server machine", says what that means.
    ports:
      - '127.0.0.1:${OYL_INSTANCE_ADMIN_LOOPBACK_PORT:-8788}:${OYL_INSTANCE_ADMIN_LOOPBACK_PORT:-8788}'

  # Cloudflare Tunnel (ADR 0037 D-8). Outbound only. Pinned by digest, as
  # every image here is: `docker buildx imagetools inspect
  # cloudflare/cloudflared:2026.10.3`, read 2026-10-26. Apache-2.0. 2026.10.2 is
  # the first release that no longer trusts the eight weak-keyed eMudhra
  # (emSign) intermediates (Cloudflare's notice of 2026-10-20): stay at or above it.
  #
  # #2805: only with the `cloudflare` profile (COMPOSE_PROFILES=cloudflare in
  # .env), so the file starts with no token and no domain (ADR 0079 D-1).
  # The token is `:-` and not `:?` because compose reads EVERY service's
  # variables, profile on or not; `deploy.sh` refuses the profile without it.
  tunnel:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    profiles: ['cloudflare']
    # `--metrics` serves cloudflared's `/ready` for the instance's Status
    # (#2604), bound to its address on `tunnel_metrics` ALONE: that server also
    # serves `/metrics`, `/config` (the tunnel's ingress), `/debug/pprof` and
    # `/diag`, so no other container — not `ollama`, not `backup` — may reach
    # it. ⚠️ NO `ports:` for it, EVER.
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - ${OYL_TUNNEL_METRICS_PREFIX:-172.30.88}.10:20241
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - instance
    restart: unless-stopped
    # FIXED addresses, so the instance can name this proxy, whose
    # client-address header it believes, by both of them
    # (OYL_INSTANCE_TRUSTED_PROXIES above). Each is its network's prefix
    # from .env and `.10` (#2918), so a changed prefix moves both together.
    networks:
      default:
        ipv4_address: ${OYL_NETWORK_PREFIX:-172.30.87}.10
      tunnel_metrics:
        ipv4_address: ${OYL_TUNNEL_METRICS_PREFIX:-172.30.88}.10

  # The owner's tailnet (#2805, ADR 0079 D-2): `tailscale serve` answers on
  # https://<TAILSCALE_HOSTNAME>.<tailnet>.ts.net:443 and proxies to the
  # instance's PUBLIC listener, by name, and to nothing else. Only with the
  # `tailscale` profile (COMPOSE_PROFILES=tailscale in .env). Outbound only:
  # TLS ends HERE, with a key Tailscale never sees, and its relays carry
  # WireGuard ciphertext. Pinned by digest: `docker buildx imagetools inspect
  # tailscale/tailscale:v1.104.7`, read 2026-11-18. BSD-3-Clause (the client;
  # the coordination service it signs in to is Tailscale's own).
  #
  # The serve configuration is the file in `tailscale/` beside this one that
  # OYL_INSTANCE_REMOTE_PATH names, read-only: `serve-tailnet.json` (Funnel
  # off) or `serve-funnel.json` (D-3); unset names no file, so the profile
  # cannot start with no remote path to cross-check the client header against. Kept on the box, never in
  # a dashboard. Tailscale's state — this machine's node key — is the
  # `tailscale` volume, so a restart is the same machine and the same name.
  #
  # ⚠️ NO `ports:`, EVER, and not on `tunnel_metrics`. Its FIXED address below
  # is in the instance's OYL_INSTANCE_TRUSTED_PROXIES, which is what makes the
  # admin pages' loopback listener close its connections unread (ADR 0069 D-5,
  # the condition it puts on cloudflared). No auth key: the first start prints
  # a sign-in link in `docker compose logs tailscale`.
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    profiles: ['tailscale']
    environment:
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-onyourleft}
      TS_AUTHKEY: ${TAILSCALE_AUTH_KEY:-}
      # Sign in once: with state kept, a restart does not use the key again.
      TS_AUTH_ONCE: 'true'
      TS_STATE_DIR: /var/lib/tailscale
      # No /dev/net/tun and no NET_ADMIN: serve needs neither.
      TS_USERSPACE: 'true'
      # The tag the documented tailnet rule lets riders reach on 443 alone
      # (home-machine.md, "The tailnet's access rule").
      TS_EXTRA_ARGS: --advertise-tags=tag:onyourleft
      TS_SERVE_CONFIG: /config/serve-${OYL_INSTANCE_REMOTE_PATH:-unset}.json
    volumes:
      - tailscale:/var/lib/tailscale
      # A directory, not a file: Tailscale's docs say the serve file must be
      # mounted so, and containerboot watches it.
      - ./tailscale:/config:ro
    depends_on:
      - instance
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${OYL_NETWORK_PREFIX:-172.30.87}.11

  # The history index's embedding model (#835, ADR 0040 D-5, D-6): a local
  # Ollama, which the instance reaches by this service's name. Only with the
  # `history` profile (COMPOSE_PROFILES=history in .env) and started by hand
  # once — `docker compose up -d ollama`, then
  # `docker compose exec ollama ollama pull nomic-embed-text` — because
  # deploy.sh starts the instance, its remote path and the backup and nothing else.
  #
  # ⚠️ NO `ports:`, EVER, and never the tunnel's target: Ollama's API has NO
  # AUTHENTICATION, so a published port is an open model server for anybody
  # who can reach it. The instance is the only thing that talks to it, over
  # this project's own network. Pinned by digest: `docker buildx imagetools
  # inspect ollama/ollama:0.34.4`, read 2026-09-30. MIT. Its weights are
  # pulled into the `models` volume, not into the image.
  #
  # A GPU is optional — embedding on the processor is enough at a rider's
  # scale. On Windows, Docker Desktop passes through an NVIDIA GPU only, on
  # the WSL2 backend: add `deploy.resources.reservations.devices` with
  # `driver: nvidia` and `capabilities: [gpu]` (docs/self-hosting/home-machine.md).
  ollama:
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    # `history` for the index (#835), `analysis` for the agent's model (#1096):
    # one Ollama serves both.
    profiles: ['history', 'analysis']
    restart: unless-stopped
    volumes:
      - models:/root/.ollama

  # The scheduled backup (#791 criterion 7, #807): an online snapshot into a
  # second directory on the box, and a copy of it OFF the box — a USB drive
  # or a share, whatever OYL_OFFBOX_DIR names. The newest OYL_BACKUP_KEEP of
  # each are kept. Since #2606 it is `backup-loop`: a run every
  # OYL_BACKUP_INTERVAL_SECONDS as before, and within 30 s of the owner's
  # "back up now" from the app's Operate area, which reaches it through the
  # database — this is the ONLY service that mounts the backup folders, and
  # the instance (which holds OYL_INSTANCE_SECRET_KEY) never does. Each run
  # is recorded in the database. `docker compose stop backup` lets a run in
  # progress finish, within the grace period.
  #
  # ⚠️ The command asks the IMAGE whether it has `backup-loop` (#2606
  # review): `deploy.sh --rollback` starts the previous image with this
  # file, and an image from before #2606 does not know the command — it
  # would exit at once, restart, and take no backup again. Such an image
  # runs the shell loop it always ran, which now stops on SIGTERM between
  # runs (its sleep is waited on, so the trap is not held up). `exec` makes
  # Node the container's first process, so `docker compose stop` reaches it.
  backup:
    <<: *instance-image
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      disable: true
    stop_grace_period: 120s
    entrypoint: ['sh', '-c']
    command:
      - >-
        if grep -q "'backup-loop'" src/operator/run.ts; then
        exec node src/operator/cli.ts backup-loop /backups --keep "$${OYL_BACKUP_KEEP}" --copy-to /offbox --interval "$${OYL_BACKUP_INTERVAL_SECONDS}";
        fi;
        trap 'exit 0' TERM;
        while true; do
        node src/operator/cli.ts backup /backups --keep "$${OYL_BACKUP_KEEP}" --copy-to /offbox;
        sleep "$${OYL_BACKUP_INTERVAL_SECONDS}" & wait $$!;
        done
    environment:
      OYL_BACKUP_KEEP: ${OYL_BACKUP_KEEP:-14}
      OYL_BACKUP_INTERVAL_SECONDS: ${OYL_BACKUP_INTERVAL_SECONDS:-21600}
    volumes:
      - data:/data
      - ${OYL_BACKUP_DIR:?set OYL_BACKUP_DIR to a directory on this machine for the snapshots}:/backups
      - ${OYL_OFFBOX_DIR:?set OYL_OFFBOX_DIR to a drive or share that is NOT this machine}:/offbox

networks:
  # #2918: each network's /24 is the first three numbers of its address, from
  # .env, so an update of this file keeps an owner's change: OYL_NETWORK_PREFIX
  # (172.30.87 when empty) and OYL_TUNNEL_METRICS_PREFIX (172.30.88). Every
  # address that depends on one is written from it, here and above: the
  # proxies' fixed addresses, OYL_INSTANCE_TRUSTED_PROXIES, the tunnel's
  # `--metrics` and OYL_INSTANCE_TUNNEL_READY_URL. Change one only if its
  # subnet is already in use on this machine.
  #
  # The project's own network, with a subnet stated so cloudflared's and
  # tailscale's addresses can be fixed (above). Nothing else in it is trusted
  # with the header.
  default:
    ipam:
      config:
        - subnet: ${OYL_NETWORK_PREFIX:-172.30.87}.0/24
  # #2604: cloudflared's metrics server, for the instance's Status. Internal
  # (no route out) and joined by `instance` and `tunnel` only, so the other
  # services cannot read the tunnel's `/config`, `/debug/pprof` or `/diag`.
  tunnel_metrics:
    internal: true
    ipam:
      config:
        - subnet: ${OYL_TUNNEL_METRICS_PREFIX:-172.30.88}.0/24

volumes:
  # The SQLite database and the blobs: the one volume that is backed up.
  data:
  # The embedding model's weights (#835): downloaded again with
  # `ollama pull`, so not backed up. The history index itself is in `data`,
  # and is made again from the synced items if it is ever lost (ADR 0040 D-1).
  models:
  # #2805: Tailscale's state, this machine's identity on the tailnet. Not
  # backed up: lost, the machine signs in again as a new one, and keeps its
  # name only if the old one is removed from the tailnet first — a new name is
  # a new origin (ADR 0079 D-8).
  tailscale:
